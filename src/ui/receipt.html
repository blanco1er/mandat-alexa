<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mandat receipt</title>
<style>/*SHARED_CSS*/
.rows > li { grid-template-columns: auto minmax(0, 1fr) auto auto; }
/* payment timeline: dots joined by a hairline, the latest state in full weight (no coloured pills) */
.tl { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; font-size: var(--t-meta); white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--label-2); }
.tl li { display: inline-flex; align-items: center; gap: .4em; }
.tl li + li::before { content: ""; width: 1.1em; height: var(--hair); background: var(--sep); margin: 0 .45em; flex: none; }
.tl i { width: .55em; height: .55em; border-radius: 50%; flex: none; background: var(--_c, var(--label-3)); }
.tl .held i { --_c: var(--accent-text); }
.tl .captured i { --_c: var(--label); }
.tl .released i { --_c: transparent; box-shadow: inset 0 0 0 max(1.5px, .12vw) var(--label-2); }
.tl .refunded i { --_c: var(--ok); }
.tl li:last-child { color: var(--label); font-weight: 590; }
.alt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: .75em; align-items: center; padding: .7em .7em .7em 1em; border-radius: var(--radius-in); background: var(--surface-2); }
.alt .who > span { white-space: normal; }
@media (max-width: 700px) { .rows > li { grid-template-columns: auto minmax(0, 1fr) auto; } .rows > li .tl { grid-column: 2 / -1; grid-row: 2; margin-top: .2em; } }
</style></head>
<body><main class="card" id="app" aria-live="polite"><p class="context">Working…</p></main>
<script>/*BRIDGE_JS*/
showLoading('Talking to PayPal sandbox…');
const LABEL = { held: 'Held', captured: 'Paid', released: 'Released', refunded: 'Refunded', changed: 'Moved' };
function render(result) {
  if (result.isError) return showError(result);
  const sc = result.structuredContent || {};
  const r = sc.receipt; if (!r) return;
  ready();
  const alts = sc.alternatives || [];
  const held = r.orders.reduce((s, o) => s + (o.state === 'held' ? o.amount : 0), 0);
  const paid = r.orders.reduce((s, o) => s + (o.captured || 0) - (o.refunded || 0), 0);
  const settled = r.orders.every((o) => o.state !== 'held');
  const mode = (r.orders[0] && r.orders[0].paypal_mode) || 'sandbox';
  const declined = r.orders.length === 1 && r.orders[0].state === 'released' && !r.orders[0].captured;
  const title = r.orders.length === 1 ? esc(r.orders[0].merchant) : `${r.orders.length} orders`;
  const st = declined ? status('wait', 'Hold released') : settled ? status('ok', 'Settled') : status('info', `${usd(held)} on hold`);
  $('#app').innerHTML = `
    <div class="head"><p class="context">Receipt · PayPal ${mode === 'offline' ? 'sandbox, simulated' : esc(mode)}</p>${st}</div>
    <div class="hero"><h1>${title}</h1><span class="num">${usd(settled ? paid : held)}<small>${settled ? 'paid' : 'held'}</small></span></div>
    <ul class="rows${r.orders.length > 3 ? ' compact' : ''}">${r.orders.slice(0, 6).map((o) => {
      const tl = o.timeline.filter((t) => t.state !== 'changed');
      return `<li>${kindIcon(o)}<span class="who"><b>${esc(o.merchant)}</b><span>${esc(o.kind === 'product' ? `${o.label} · ${o.slotLabel || ''}` : o.slotLabel || o.label || '')}</span></span>
        <ol class="tl" aria-label="Payment timeline">${tl.map((t) => `<li class="${t.state}"><i aria-hidden="true"></i>${LABEL[t.state] || esc(t.state)}${t.amount ? ' ' + usd(t.amount) : ''}</li>`).join('')}</ol>
        <span class="amt">${usd(o.state === 'held' ? o.amount : (o.captured || 0) - (o.refunded || 0))}</span></li>`;
    }).join('')}</ul>
    ${alts.length ? `<div class="alt">${kindIcon(alts[0])}<span class="who"><b>Replacement: ${esc(alts[0].merchant)}</b><span>${esc(alts[0].slot_label)}</span></span><span class="amt">${usd(alts[0].total)}</span><button class="btn primary" id="alt">Book</button></div>` : ''}
    ${r.envelope ? gauge(r.envelope) : ''}`;
  const a = $('#alt');
  if (a) a.onclick = () => {
    if (a.disabled) return;
    a.disabled = true; a.setAttribute('aria-busy', 'true'); a.innerHTML = '<span class="spin" aria-hidden="true"></span>Asking…';
    mcpApp.say(`Book ${alts[0].merchant} instead (offer ${alts[0].id}).`).catch(() => { a.disabled = false; a.removeAttribute('aria-busy'); a.textContent = 'Book'; });
  };
}
mcpApp.on('result', render);
mcpApp.connect('mandat-receipt');
</script></body></html>
