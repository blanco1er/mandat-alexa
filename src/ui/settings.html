<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mandat settings</title>
<style>/*SHARED_CSS*/
/* The rules the household gives Mandat. Opens by itself on first run, then with "Alexa, open Mandat settings".
   Everything can be set by touch or by voice; a change said aloud lands here live (the changed field pulses). */
.cols { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: calc(var(--gap) * 1.6); align-items: start; }
.field { position: relative; display: grid; gap: calc(var(--gap) * .5); padding: calc(var(--gap) * .7) calc(var(--gap) * .85); margin: calc(var(--gap) * -.7) calc(var(--gap) * -.85); border-radius: var(--radius-in);
  transition: box-shadow var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out); }
.field + .field { margin-top: calc(var(--gap) * .5); }
.label { margin: 0; font-size: var(--t-meta); color: var(--label-2); font-weight: 590; display: flex; justify-content: space-between; align-items: center; gap: 1em; }
.field.asking { box-shadow: inset 0 0 0 max(2px, .16vw) var(--accent); background: var(--accent-tint); }
.asking-tag { display: none; font-size: var(--t-meta); font-weight: 590; color: var(--accent-text); white-space: nowrap; }
.field.asking .asking-tag { display: inline-flex; align-items: center; gap: .4em; }
.asking-tag::before { content: ""; width: .5em; height: .5em; border-radius: 50%; background: var(--accent); animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }
.field.pulse { animation: pulse 1.1s var(--ease-smooth); }
@keyframes pulse { 0% { background: var(--accent-tint); } 100% { background: transparent; } }
.field.asking.pulse { animation: none; }
/* steppers: a big number between two round buttons */
.stepper { display: flex; align-items: center; gap: .55em; }
.round { appearance: none; border: 0; cursor: pointer; width: max(48px, 1.9em); height: max(48px, 1.9em); border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--fill); color: var(--label); transition: transform var(--dur-bouncy) var(--ease-bouncy), background-color var(--dur-fade); }
.round:active { transform: scale(.9); }
.round:focus-visible, .tile:focus-visible, .chip:focus-visible, input[type=range]:focus-visible { outline: max(3px, .25vw) solid color-mix(in srgb, #0088ff 70%, transparent); outline-offset: max(2px, .15vw); }
.round svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.round[disabled] { opacity: .35; cursor: default; }
.val { min-width: 3.2ch; text-align: center; font-variant-numeric: tabular-nums; }
.big .val { font-size: var(--t-num); font-weight: 700; letter-spacing: -.035em; line-height: 1; }
.mid .val { font-size: calc(var(--t-num) * .62); font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.big .val small, .mid .val small { font-size: .36em; font-weight: 590; color: var(--label-2); margin-left: .2em; letter-spacing: -.01em; }
/* the weekly budget slider: thick track, filled to the value */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: max(28px, 2.2vw); background: transparent; margin: 0; cursor: pointer; --p: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: max(8px, .7vw); border-radius: 999px; background: linear-gradient(90deg, var(--accent) var(--p), var(--fill) var(--p)); }
input[type=range]::-moz-range-track { height: max(8px, .7vw); border-radius: 999px; background: linear-gradient(90deg, var(--accent) var(--p), var(--fill) var(--p)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: max(28px, 2.2vw); height: max(28px, 2.2vw); border-radius: 50%; background: #fff; margin-top: calc((max(8px, .7vw) - max(28px, 2.2vw)) / 2); box-shadow: 0 .5px 4px rgba(0,0,0,.12), 0 6px 13px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
input[type=range]::-moz-range-thumb { width: max(28px, 2.2vw); height: max(28px, 2.2vw); border: 0; border-radius: 50%; background: #fff; box-shadow: 0 .5px 4px rgba(0,0,0,.12), 0 6px 13px rgba(0,0,0,.12); }
.ticks { display: flex; justify-content: space-between; font-size: var(--t-meta); color: var(--label-2); font-variant-numeric: tabular-nums; margin-top: -.2em; }
/* three autonomy tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5em; }
.tile { appearance: none; border: 0; cursor: pointer; text-align: left; display: grid; align-content: start; gap: .3em; padding: .7em .8em .8em; border-radius: var(--radius-in); background: var(--fill); color: var(--label); min-height: 4.6em;
  transition: transform var(--dur-bouncy) var(--ease-bouncy), background-color var(--dur-fade), box-shadow var(--dur-fade); }
.tile:active { transform: scale(.97); }
.tile b { font-weight: 590; font-size: var(--t-body); line-height: 1.12; }
.tile span { font-size: var(--t-meta); color: var(--label-2); line-height: 1.22; }
.tile[aria-checked="true"] { background: var(--accent-tint); box-shadow: inset 0 0 0 max(2px, .16vw) var(--accent); }
.tile[aria-checked="true"] b { color: var(--accent-text); }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: calc(var(--gap) * 1.2); }
.pair > .field + .field { margin-top: calc(var(--gap) * -.7); }
.cols > div > .pair + .field { margin-top: calc(var(--gap) * .5); }
.dim { opacity: .45; }
/* categories: toggle chips (pressed = Mandat may buy it) */
.chips { display: flex; flex-wrap: wrap; gap: .45em; }
.chip { appearance: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: .4em; min-height: max(44px, 1.95em); padding: 0 .85em; border-radius: 999px; font-size: var(--t-meta); font-weight: 590;
  background: var(--fill); color: var(--label-2); transition: background-color var(--dur-fade), color var(--dur-fade), transform var(--dur-bouncy) var(--ease-bouncy); }
.chip:active { transform: scale(.95); }
.chip svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; display: none; }
.chip[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-text); }
.chip[aria-pressed="true"] svg { display: block; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 1em; flex-wrap: wrap; }
.hint { margin: 0; font-size: var(--t-meta); color: var(--label-2); }
.saved { display: inline-flex; align-items: center; gap: .45em; font-size: var(--t-meta); font-weight: 590; color: var(--label-2); }
.saved svg { width: 1.1em; height: 1.1em; fill: none; stroke: var(--ok); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.link-danger { appearance: none; border: 0; background: none; color: var(--bad-text); font-size: var(--t-meta); font-weight: 590; cursor: pointer; min-height: 44px; padding: 0 .4em; }
.banner { margin: 0; padding: .6em .85em; border-radius: var(--radius-in); background: color-mix(in srgb, var(--bad-text) 12%, transparent); color: var(--label); font-size: var(--t-meta); font-weight: 590; }
.confirm { display: grid; gap: .6em; padding: .8em .9em; border-radius: var(--radius-in); background: color-mix(in srgb, var(--bad-text) 9%, transparent); }
.confirm p { margin: 0; font-size: var(--t-meta); }
.btn.danger { background: var(--bad-text); color: #fff; }
@media (max-width: 640px) { .cols, .pair { grid-template-columns: minmax(0, 1fr); } .tiles { grid-template-columns: minmax(0, 1fr); } .tile { min-height: 0; } }
@media (prefers-reduced-motion: reduce) { .field.pulse, .asking-tag::before { animation: none; } }
</style></head>
<body><main class="card" id="app" aria-live="polite"><p class="context">Opening your settings…</p></main>
<script>/*BRIDGE_JS*/
showLoading('Opening your settings…');
const CATS = [['cleaning', 'Cleaning'], ['catering', 'Catering'], ['repairs', 'Repairs'], ['home', 'Home and bedding'], ['pets', 'Pet supplies'], ['pantry', 'Pantry']];
const LEVELS = [['ask', 'Ask me first'], ['balanced', 'Balanced'], ['hands_off', 'Hands-off within limits']];
const MINUS = '<svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>', PLUS = '<svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>';
const TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg>';
let S = null;        // last structuredContent from the server (the truth)
let local = {};      // values being edited by touch, sent after a short pause
let timer = 0, confirming = false, sending = false;
const W = { min: 10, max: 1000, step: 10 };
const desc = (lvl, s) => lvl === 'ask' ? tx('Asks before every payment.') : lvl === 'balanced' ? tx('Buys alone under {auto}, asks above.', { auto: usd(s.auto_buy_under) }) : tx('Buys alone up to {cap} a day.', { cap: usd(s.daily_cap) });
function view() { return { ...S.settings, ...local }; }
function field(id, label, body, step) {
  const asking = S.onboarding_step === step;
  const pulse = (S.changed || []).includes(step) || (S.changed || []).includes(id) ? ' pulse' : '';
  return `<section class="field${asking ? ' asking' : ''}${pulse}" id="f-${id}" aria-labelledby="l-${id}"><p class="label"><span id="l-${id}">${tx(label)}</span><span class="asking-tag">${tx('Alexa is asking')}</span></p>${body}</section>`;
}
function stepper(id, value, cls, what) {
  return `<div class="stepper ${cls}"><button class="round" data-step="${id}" data-dir="-1" aria-label="${esc(tx('Decrease {what}', { what: tx(what) }))}">${MINUS}</button>
    <span class="val" id="v-${id}" aria-live="polite">${usd(value)}</span>
    <button class="round" data-step="${id}" data-dir="1" aria-label="${esc(tx('Increase {what}', { what: tx(what) }))}">${PLUS}</button></div>`;
}
function render(result) {
  if (result.isError) { sending = false; return showError(result); }
  ready();
  const sc = result.structuredContent || {};
  if (!sc.settings) return;
  S = sc; local = {}; sending = false;
  draw();
}
function draw() {
  const s = view();
  const first = S.first_run && !s.onboarded;
  const given = S.profile?.given_name;
  const pct = ((Math.min(W.max, s.weekly_budget) - W.min) / (W.max - W.min)) * 100;
  const st = s.paused ? status('bad', tx('Paused')) : status('ok', tx('Active'));
  $('#app').innerHTML = `
    <div class="head"><p class="context">${tx('Mandat settings')}</p>${st}</div>
    <h1>${first ? esc(tx('Welcome{name}. Set your rules', { name: given ? ', ' + given : '' })) : tx('How Mandat spends')}</h1>
    ${s.paused ? `<p class="banner">${tx('Mandat is paused. Nothing is bought until you resume.')}</p>` : ''}
    <div class="cols">
      <div>
        ${field('weekly_budget', 'Weekly budget', `${stepper('weekly_budget', s.weekly_budget, 'big', 'Weekly budget')}
          <input type="range" id="range" min="${W.min}" max="${W.max}" step="${W.step}" value="${Math.min(W.max, s.weekly_budget)}" style="--p:${pct}%" aria-label="${esc(tx('Weekly budget'))}" aria-valuetext="${esc(usd(s.weekly_budget))}">
          <div class="ticks" aria-hidden="true"><span>${usd(W.min)}</span><span>${usd(W.max / 2)}</span><span>${usd(W.max)}</span></div>`, 'weekly_budget')}
        ${field('autonomy', 'Freedom', `<div class="tiles" role="radiogroup" aria-labelledby="l-autonomy">${LEVELS.map(([k, l]) => `<button class="tile" role="radio" aria-checked="${s.autonomy === k}" data-level="${k}"><b>${tx(l)}</b><span>${esc(desc(k, s))}</span></button>`).join('')}</div>`, 'autonomy')}
      </div>
      <div>
        <div class="pair">
          ${field('auto_buy_under', 'Buys on its own under', `<div class="${s.autonomy === 'balanced' ? '' : 'dim'}">${stepper('auto_buy_under', s.auto_buy_under, 'mid', 'Buys on its own under')}</div>`, 'auto_buy_under')}
          ${field('daily_cap', 'Daily limit on its own', `<div class="${s.autonomy === 'ask' ? 'dim' : ''}">${stepper('daily_cap', s.daily_cap, 'mid', 'Daily limit on its own')}</div>${S.auto_spent_today ? `<p class="hint">${tx('{amt} used today on its own', { amt: usd(S.auto_spent_today) })}</p>` : ''}`, 'daily_cap')}
        </div>
        ${field('categories', 'Categories', `<div class="chips">${CATS.map(([k, l]) => `<button class="chip" aria-pressed="${(s.categories || []).includes(k)}" data-cat="${k}">${TICK}${tx(l)}</button>`).join('')}</div>`, 'categories')}
      </div>
    </div>
    ${confirming ? `<div class="confirm" role="alertdialog" aria-label="${esc(tx('Delete my data'))}"><p>${tx('Delete everything Mandat knows about this household? Open holds are voided first. This cannot be undone.')}</p>
        <div class="actions"><button class="btn" id="no">${tx('Cancel')}</button><button class="btn danger" id="yes" data-label="${tx('Delete')}">${tx('Delete')}</button></div></div>`
      : `<div class="foot">
        <div class="actions">
          ${first ? `<button class="btn primary" id="done" data-label="${tx('Done')}">${tx('Done')}</button>` : `<span class="saved">${TICK}${tx('Saved')}</span>`}
          <button class="btn" id="pause" data-label="${tx(s.paused ? 'Resume spending' : 'Pause spending')}">${tx(s.paused ? 'Resume spending' : 'Pause spending')}</button>
        </div>
        <p class="hint">${first ? esc(tx('Say “200 a week”, “Balanced” or “that’s all”.')) : `<button class="link-danger" id="del">${tx('Delete my data')}</button>`}</p>
      </div>`}`;
  wire();
}
// touch: show the new value at once, send it after a short pause (one spoken confirmation per change, not per tap)
function queue(patch, now = false) {
  Object.assign(local, patch);
  draw();
  clearTimeout(timer);
  timer = setTimeout(send, now ? 0 : 650);
}
async function send() {
  const patch = { ...local };
  if (!Object.keys(patch).length || sending) return;
  sending = true;
  try { render(await mcpApp.callTool('update_settings', patch)); } catch { sending = false; local = {}; draw(); }
}
function wire() {
  for (const b of document.querySelectorAll('[data-step]')) b.onclick = () => {
    const k = b.dataset.step, s = view();
    const step = k === 'weekly_budget' ? 10 : k === 'auto_buy_under' ? 5 : 10;
    const next = Math.max(0, Math.round((s[k] + step * Number(b.dataset.dir)) / step) * step);
    queue({ [k]: k === 'weekly_budget' ? Math.max(10, next) : next });
  };
  const r = $('#range');
  if (r) {
    r.oninput = () => { const v = Number(r.value); r.style.setProperty('--p', `${((v - W.min) / (W.max - W.min)) * 100}%`); $('#v-weekly_budget').textContent = usd(v); local.weekly_budget = v; clearTimeout(timer); };
    r.onchange = () => queue({ weekly_budget: Number(r.value) });
  }
  for (const t of document.querySelectorAll('[data-level]')) t.onclick = () => queue({ autonomy: t.dataset.level }, true);
  for (const c of document.querySelectorAll('[data-cat]')) c.onclick = () => {
    const on = c.getAttribute('aria-pressed') === 'true';
    queue(on ? { categories_off: [c.dataset.cat] } : { categories_on: [c.dataset.cat] }, true);
  };
  const busy = (b) => { b.disabled = true; b.setAttribute('aria-busy', 'true'); b.innerHTML = `<span class="spin" aria-hidden="true"></span>${esc(b.dataset.label)}`; };
  const done = $('#done'); if (done) done.onclick = async () => { busy(done); clearTimeout(timer); try { render(await mcpApp.callTool('update_settings', { ...local, onboarded: true })); } catch { draw(); } };
  const pause = $('#pause'); if (pause) pause.onclick = async () => { busy(pause); try { await mcpApp.callTool(view().paused ? 'resume_spending' : 'pause_spending', {}); S.settings.paused = !view().paused; draw(); } catch { draw(); } };
  const del = $('#del'); if (del) del.onclick = () => { confirming = true; draw(); $('#no')?.focus(); };
  const no = $('#no'); if (no) no.onclick = () => { confirming = false; draw(); };
  const yes = $('#yes'); if (yes) yes.onclick = async () => { busy(yes); try { await mcpApp.callTool('delete_my_data', { user_confirmation: 'tap:delete' }); } catch { confirming = false; draw(); } };
}
mcpApp.on('result', render);
mcpApp.connect('mandat-settings');
</script></body></html>
