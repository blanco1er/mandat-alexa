<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mandat offers</title>
<style>/*SHARED_CSS*/
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 2 * var(--gap)) / 3); gap: var(--gap); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  margin: 0 calc(var(--pad) * -1); padding: .2em var(--pad); scroll-padding: 0 var(--pad); }
.rail.two { grid-auto-columns: calc((100% - var(--gap)) / 2); }
.rail::-webkit-scrollbar { display: none; }
.offer { scroll-snap-align: start; position: relative; display: grid; align-content: start; gap: .38em; text-align: left; padding: .85em .95em .95em; border-radius: var(--radius-in);
  border: 0; background: var(--surface-2); cursor: pointer; min-width: 0;
  box-shadow: inset 0 0 0 var(--hair) transparent; transition: box-shadow var(--dur-snappy) var(--ease-snappy), background-color var(--dur-fade) var(--ease-out), transform var(--dur-bouncy) var(--ease-bouncy); }
.offer:active { transform: scale(.98); }
.offer[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 8%, var(--surface-2)); box-shadow: inset 0 0 0 max(2px, .18vw) var(--accent); }
.offer:focus-visible { outline: max(3px, .25vw) solid color-mix(in srgb, #0088ff 70%, transparent); outline-offset: 2px; }
/* item photo on top of each option, like Alexa shopping cards (16:10 so three options still fit without scrolling) */
.offer .ph { display: block; aspect-ratio: 16 / 10; margin: -.4em -.5em .25em; border-radius: calc(var(--radius-in) * .72); overflow: hidden; background: var(--fill); position: relative; }
.offer .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.offer .ph::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 var(--hair) rgba(0, 0, 0, .1); }
.offer .ph.broken img { visibility: hidden; }
.offer .sel { z-index: 1; }
.hero .thumb.lg { width: 4.4em; height: 4.4em; align-self: center; }
.hero .lead-in { display: flex; align-items: center; gap: .9em; min-width: 0; }
.offer .top { display: flex; align-items: center; gap: .55em; min-width: 0; }
.offer .top b { font-weight: 590; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.offer .price { font-size: var(--t-title); font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.offer .price s { font-size: var(--t-meta); color: var(--label-2); font-weight: 400; margin-left: .5em; letter-spacing: 0; }
.offer .when { font-size: var(--t-meta); color: var(--label); font-weight: 510; }
.offer .quote { font-size: var(--t-meta); color: var(--label-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.offer .sel { position: absolute; top: .8em; right: .8em; width: 1.2em; height: 1.2em; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff;
  opacity: 0; transform: scale(.5); transition: opacity var(--dur-fade) var(--ease-out), transform var(--dur-bouncy) var(--ease-bouncy); }
.offer .sel svg { width: 64%; height: 64%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.offer[aria-pressed="true"] .sel { opacity: 1; transform: none; }
.trust { display: inline-flex; align-items: center; gap: .4em; font-size: var(--t-meta); font-weight: 590; color: var(--ok-text); }
.trust svg { width: 1.05em; height: 1.05em; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.trust.no { color: var(--warn-text); }
.best { font-size: var(--t-meta); font-weight: 590; color: var(--accent-text); }
/* one quote: the quote itself is the content */
.single { display: grid; gap: .55em; }
.single .said { margin: 0; font-size: var(--t-body); line-height: 1.35; text-wrap: pretty; }
.single .said::before { content: "“"; } .single .said::after { content: "”"; }
.facts { display: flex; flex-wrap: wrap; gap: .3em 1.2em; font-size: var(--t-meta); color: var(--label-2); align-items: center; }
.facts b { color: var(--label); font-weight: 590; }
</style></head>
<body><main class="card" id="app" aria-live="polite"><p class="context">Asking the merchants…</p></main>
<script>/*BRIDGE_JS*/
showLoading('Asking the merchants’ agents…');
const ASKED = { catering: ['{n} caterer asked', '{n} caterers asked'], cleaning: ['{n} cleaner asked', '{n} cleaners asked'], plumbing: ['{n} plumber asked', '{n} plumbers asked'], handyman: ['{n} handyman asked', '{n} handymen asked'] };
const nameOf = (o) => (o.kind === 'service' ? o.merchant : P(o.title).split(/[:,(]/)[0].trim());
const CHECK = `<svg viewBox="0 0 24 24">${ICONS.check}</svg>`;
const trust = (o) => o.kind !== 'service' ? (o.matches_preference ? `<span class="trust">${CHECK}${tx('Your usual')}</span>` : '') : o.card_verified ? `<span class="trust">${CHECK}${tx('Verified agent')}</span>` : `<span class="trust no">${tx('Unverified agent')}</span>`;
function render(result) {
  if (result.isError) return showError(result);
  ready();
  const sc = result.structuredContent || {};
  const offers = sc.offers || sc.alternatives || [];
  const cur = sc.current_offer_id ? offers.find((o) => o.id === sc.current_offer_id) : null;
  const who = cur ? tx('Other options than {name}', { name: nameOf(cur) }) : sc.category ? tx((ASKED[sc.category] || [null, '{n} pros asked'])[sc.asked === 1 ? 0 : 1] || '{n} pros asked', { n: sc.asked }) : sc.query ? tx('Products') : tx('Updated quote');
  if (!offers.length) {
    $('#app').innerHTML = `<div class="head"><p class="context">${esc(who)}</p>${status('wait', tx('No match'))}</div>
      <h1>${tx('No one can do it at that time')}</h1><p class="lead">${tx('Try another day, or a higher price limit.')}</p>`;
    return;
  }
  const svc = offers[0].kind === 'service';
  const skipped = sc.skipped && sc.skipped.length;
  const st = skipped ? status('info', tx('{n} skipped for your household', { n: sc.skipped.length })) : svc ? status('ok', tx(offers.length === 1 ? '{n} quote' : '{n} quotes', { n: offers.length })) : '';
  const best = cur || offers[0];
  if (offers.length === 1) {
    const o = best;
    $('#app').innerHTML = `
      <div class="head"><p class="context">${esc(who)}${o.kind === 'service' && o.card_verified ? tx(' · agent card verified') : ''}</p>${st}</div>
      <div class="hero"><div class="lead-in">${o.image_url ? thumb(o, 'lg') : ''}<div class="stack"><h1>${esc(o.merchant)}</h1><span class="meta">${esc(slotL(o.slot_label))}${o.kind === 'service' && o.rating ? ` · ${tx('rated {r}', { r: o.rating })}` : ''}</span></div></div>
        <span class="num">${usd(o.total)}</span></div>
      <div class="single">
        ${o.kind === 'service' ? `<p class="said">${esc(o.negotiation)}</p>` : `<p class="said">${esc(P(o.title))}</p>`}
        <div class="facts">${o.discount ? `<span>${tx('Was')} <b>${usd(o.base + (o.fees || 0))}</b></span><span>${tx('Negotiated')} <b style="color:var(--ok-text)">−${usd(o.discount)}</b></span>` : ''}${trust(o)}</div>
      </div>`;
    return;
  }
  $('#app').innerHTML = `
    <div class="head"><p class="context">${esc(who)}${svc && !cur ? tx(' · every agent verified') : ''}</p>${st}</div>
    <div class="hero"><div class="stack"><span class="best">${tx(cur ? 'Now in your plan' : svc ? 'Best quote' : 'Best match')}</span><h1>${esc(cur && cur.kind === 'product' ? nameOf(cur) : best.merchant)}</h1></div><span class="num">${usd(best.total)}</span></div>
    <div class="rail${offers.length < 3 ? ' two' : ''}" role="list" aria-label="${tx('Options')}">${offers.slice(0, 5).map((o, i) => `
      <button class="offer" role="listitem" aria-pressed="${cur ? o.id === cur.id : i === 0}" data-id="${esc(o.id)}" aria-label="${esc(o.kind === 'product' ? P(o.title) : o.merchant)}, ${esc(usd(o.total))}, ${esc(slotL(o.slot_label))}${cur && o.id !== cur.id ? esc(tx('. Tap to take it instead')) : ''}">
        <span class="sel" aria-hidden="true">${CHECK}</span>
        ${o.image_url ? `<span class="ph"><img src="${esc(o.image_url)}" alt="${esc(o.image_alt || P(o.title))}" loading="lazy" decoding="async"></span>` : ''}
        <span class="top">${o.image_url ? '' : kindIcon(o)}<b>${esc(cur && o.kind === 'product' ? nameOf(o) : o.merchant)}</b></span>
        <span class="price">${usd(o.total)}${o.discount ? `<s>${usd(o.base + (o.fees || 0))}</s>` : ''}</span>
        <span class="when">${esc(slotL(o.slot_label))}${o.kind === 'service' && o.rating ? ` · ${o.rating}` : ''}</span>
        <span class="quote">${o.kind === 'service' ? `“${esc(o.negotiation)}”` : esc(P(o.title))}</span>
        ${trust(o)}
      </button>`).join('')}</div>`;
  // Alternatives to a plan line: a tap on another option is "take this one instead" (said to Alexa, same guardrails).
  if (cur) {
    for (const b of document.querySelectorAll('.offer')) b.onclick = () => {
      const o = offers.find((x) => x.id === b.dataset.id);
      if (o.id === cur.id || b.getAttribute('aria-busy')) return;
      for (const x of document.querySelectorAll('.offer')) x.setAttribute('aria-pressed', String(x === b));
      b.setAttribute('aria-busy', 'true');
      mcpApp.say(tx('Take {name} instead.', { name: nameOf(o) })).catch(() => b.removeAttribute('aria-busy'));
    };
    return;
  }
  for (const b of document.querySelectorAll('.offer')) b.onclick = () => {
    for (const x of document.querySelectorAll('.offer')) x.setAttribute('aria-pressed', String(x === b));
    const o = offers.find((x) => x.id === b.dataset.id);
    mcpApp.updateModelContext([{ type: 'text', text: `The user selected ${o.merchant} (${o.title}, ${usd(o.total)}). offer_id=${o.id}` }], { selected_offer_id: o.id }).catch(() => {});
  };
}
mcpApp.on('result', render);
mcpApp.connect('mandat-offers');
</script></body></html>
