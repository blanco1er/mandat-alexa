<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mandat status</title>
<style>/*SHARED_CSS*/
.envs { display: grid; gap: calc(var(--gap) * 1.1); }
.env-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; font-weight: 590; }
.env-head span { font-weight: 400; color: var(--label-2); font-size: var(--t-meta); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fact { margin: 0; font-size: var(--t-title); font-weight: 700; letter-spacing: -.022em; line-height: 1.12; text-wrap: balance; }
.fact .who-is { display: block; font-size: var(--t-body); font-weight: 590; color: var(--label-2); letter-spacing: -.012em; margin-bottom: .2em; }
.memory .who b { font-weight: 590; }
.memory li.is-new .who b::after { content: " · just now"; font-weight: 400; color: var(--label-2); font-size: var(--t-meta); }
</style></head>
<body><main class="card" id="app" aria-live="polite"><p class="context">Checking your household…</p></main>
<script>/*BRIDGE_JS*/
showLoading('Checking your household…');
function memoryList(prefs, savedId, max) {
  if (!prefs.length) return '';
  return `<ul class="rows memory">${prefs.slice(-max).reverse().map((p) => `<li class="${p.id === savedId ? 'is-new' : ''}">${icon('memory')}<span class="who"><b>${esc(p.subject)}</b><span>${esc(p.fact)}</span></span><span></span></li>`).join('')}</ul>`;
}
function render(result) {
  if (result.isError) return showError(result);
  ready();
  const sc = result.structuredContent || {};
  const envs = sc.envelopes || [];
  const prefs = sc.preferences || [];
  const open = sc.open_orders || [];
  const main = envs[0];
  if (sc.saved) {
    const others = prefs.filter((p) => p.id !== sc.saved.id);
    $('#app').innerHTML = `
      <div class="head"><p class="context">${tx(prefs.length === 1 ? 'Household memory · {n} fact' : 'Household memory · {n} facts', { n: prefs.length })}</p>${status('ok', tx('Remembered'))}</div>
      <p class="fact"><span class="who-is">${esc(sc.saved.subject)}</span>${esc(cap(sc.saved.fact))}</p>
      <p class="note">${tx('Used in every search and every session from now on.')}</p>
      ${memoryList(others, null, 3)}`;
    return;
  }
  const pending = (sc.pending_decisions || []).length;
  const st = pending ? status('wait', tx('{n} waiting for your yes', { n: pending })) : open.length ? status('info', tx('{n} on hold', { n: open.length })) : status('ok', tx('All settled'));
  if (!main) {
    $('#app').innerHTML = `<div class="head"><p class="context">${tx('Household')}</p>${st}</div>
      <h1>${tx('No budget yet')}</h1><p class="lead">${esc(tx('Say “Set a weekly household budget of $150, and buy on your own under $40.”'))}</p>${memoryList(prefs, null, 3)}`;
    return;
  }
  $('#app').innerHTML = `
    <div class="head"><p class="context">${tx(envs.length === 1 ? 'Household · {n} budget' : 'Household · {n} budgets', { n: envs.length })}</p>${st}</div>
    <div class="hero"><h1>${esc(main.purpose)}</h1><span class="num">${usd(main.remaining)}<small>${tx('left')}</small></span></div>
    <div class="envs">${envs.slice(0, 2).map((e, i) => (i ? `<div class="env-head">${esc(e.purpose)}<span>${tx('{amt} left', { amt: usd(e.remaining) })}</span></div>` : '') + gauge(e)).join('')}</div>
    ${open.length ? `<ul class="rows">${open.slice(0, 3).map((o) => `<li>${thumb(o, 'sm')}<span class="who"><b>${esc(o.merchant)}</b><span>${esc(o.slotLabel ? slotL(o.slotLabel) : P(o.label) || '')}</span></span><span class="amt">${usd(o.amount)}</span></li>`).join('')}</ul>` : memoryList(prefs, null, 2)}`;
}
mcpApp.on('result', render);
mcpApp.connect('mandat-status');
</script></body></html>
