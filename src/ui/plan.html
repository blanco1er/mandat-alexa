<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mandat plan</title>
<style>/*SHARED_CSS*/
.foot { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: calc(var(--gap) * 1.6); align-items: center; padding-top: calc(var(--gap) * .2); }
:root[data-display="fullscreen"] #expand, :root:not([data-display="fullscreen"]) #back { display: none; }
:root:not([data-display="fullscreen"]) .who span.long { display: none; }
.who span.long { white-space: normal; }
.also { margin: 0; display: flex; align-items: baseline; gap: .8em; font-size: var(--t-meta); color: var(--label-2); padding: .55em .8em; border-radius: var(--radius-in); background: var(--surface-2); min-width: 0; }
.also span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.also b { color: var(--label); font-weight: 590; }
.err { flex-basis: 100%; margin: 0; font-size: var(--t-meta); color: var(--bad-text); }
/* every line opens its details (photos, why, rule): tap, or say "show me the bed linen" */
.rows.tap > li { cursor: pointer; border-radius: var(--radius-in); transition: background-color var(--dur-fade) var(--ease-out); margin: 0 calc(var(--pad) * -.35); padding-inline: calc(var(--pad) * .35); }
.rows.tap > li:active { background: var(--fill); }
.rows.tap > li:focus-visible { outline: max(3px, .25vw) solid color-mix(in srgb, #0088ff 70%, transparent); outline-offset: -2px; }
.chev { display: inline-block; vertical-align: -.06em; width: .62em; height: .62em; color: var(--label-3); margin-left: .45em; }
.chev svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; display: block; }
.rows > li.new { background: color-mix(in srgb, var(--ok) 10%, transparent); }
.newtag { color: var(--ok-text); font-weight: 590; font-size: var(--t-meta); margin-left: .5em; }
</style></head>
<body><main class="card" id="app" aria-live="polite"><p class="context">Preparing your plan…</p></main>
<script>/*BRIDGE_JS*/
showLoading('Preparing your plan…');
let current = null;
const TICK = `<span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS.check}</svg></span>`;
function render(result, { justBooked = false } = {}) {
  if (result.isError) return showError(result);
  const sc = result.structuredContent || {};
  const plan = sc.plan; if (!plan) return;
  ready();
  current = sc;
  const b = plan.breakdown;
  const n = plan.lines.length;
  const booked = plan.status === 'confirmed';
  const st = booked ? status('ok', tx('Booked')) : plan.auto_approved ? status('ok', tx('Within your rule')) : status('wait', tx('Needs your yes'));
  const env = sc.envelope;
  $('#app').innerHTML = `
    <div class="head"><p class="context">${esc(plan.purpose || tx('Plan'))} · ${booked ? tx('payment holds placed') : sc.revised ? tx('updated, was {amt}', { amt: usd(sc.revised.previous_total) }) : n === 1 ? tx('one item') : tx('{n} items in one plan', { n })}</p>${st}</div>
    <div class="hero">
      <h1>${booked ? (n === 1 ? tx('Booked') : tx('{n} bookings, one approval', { n })) : n === 1 ? esc(cap(P(plan.lines[0].title) || plan.lines[0].merchant)) : tx('{n} items, one yes', { n })}</h1>
      <span class="num">${usd(b.total)}</span>
    </div>
    <ul class="rows${booked ? '' : ' tap'}">${plan.lines.map((l) => `<li${booked ? '' : ` role="button" tabindex="0" data-say="${esc(tx('Show me {name}.', { name: l.kind === 'product' ? P(l.title).split(/[:,(]/)[0].trim() : l.merchant }))}" aria-label="${esc(tx('{m}, {amt}. Show details', { m: l.merchant, amt: usd(l.total) }))}"`}${(sc.revised?.added || []).includes(l.offer_id) && !booked ? ' class="new"' : ''}>${thumb(l)}<span class="who"><b>${esc(l.merchant)}${(sc.revised?.added || []).includes(l.offer_id) && !booked ? `<span class="newtag">${tx('New')}</span>` : ''}</b><span>${origin(l) ? `${esc(origin(l))} · ` : ''}${l.kind === 'product' ? (n === 1 || l.live ? esc(slotL(l.detail)) : `${esc(P(l.title))} · ${esc(slotL(l.detail))}`) : `${esc(slotL(l.detail))}${l.guests ? ` · ${tx('{n} guests', { n: l.guests })}` : ''}`}</span>${l.kind === 'product' ? '' : `<span class="long">${esc(P(l.title))}</span>`}</span><span class="amt">${l.discount ? `<s>${usd(l.base + (l.fees || 0))}</s>` : ''}${esc(priceOf(l))}${booked ? '' : '<span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>'}</span></li>`).join('')}</ul>
    ${(sc.also_bought || []).length && !booked ? `<p class="also">${status('ok', tx('Already bought'))}<span>${sc.also_bought.map((o) => `${esc(o.merchant)}, ${esc(P(o.label) || '')} <b>${usd(o.amount)}</b>`).join(' · ')}, ${env && env.auto_approve_under ? tx('within your {amt} rule', { amt: usd(env.auto_approve_under) }) : tx('within your rule')}</span></p>` : ''}
    <p class="breakdown"><span>${tx('Base')} <b>${usd(b.base)}</b></span>${b.discount ? `<span>${tx('Negotiated')} <b class="saved">−${usd(b.discount)}</b></span>` : ''}<span>${tx('Fees')} <b>${usd(b.fees)}</b></span><span>${tx('Tax')} <b>${usd(b.tax)}</b></span><span>${tx('Total')} <b>${usd(b.total)}</b></span></p>
    <div class="foot">
      <div class="actions" id="actions">${booked ? `<span class="done">${TICK}${tx('Booked')}<span>${tx('Nothing is charged until it is done')}</span></span>` :
        `<button class="btn primary" id="approve">${plan.auto_approved ? tx('Buy now') : tx('Approve {amt}', { amt: usd(b.total) })}</button><button class="btn" id="expand">${tx('Details')}</button><button class="btn" id="back">${tx('Back')}</button>`}</div>
      ${env ? gauge(env, booked ? {} : { adding: b.total, after: plan.remaining_after ?? null, grow: !current.__shown }) : ''}
    </div>${plan.lines.some((l) => l.source || l.live) ? honestNote(sc.pay_mode) : ''}`;
  if (!booked) { growGauges(); current.__shown = true; }
  const a = $('#approve');
  if (a) a.onclick = async () => {
    if (a.disabled) return;
    a.disabled = true; a.setAttribute('aria-busy', 'true'); a.innerHTML = `<span class="spin" aria-hidden="true"></span>${tx('Placing holds…')}`;
    $('#actions .err')?.remove();
    const fail = (msg) => { a.disabled = false; a.removeAttribute('aria-busy'); a.textContent = tx('Try again'); if (msg) $('#actions').insertAdjacentHTML('beforeend', `<p class="err">${esc(msg)}</p>`); };
    try {
      // A plan re-opened with review_plan carries no token: the tap is a spoken yes, the host holds the token.
      if (!current.confirmation_token) { await mcpApp.say(tx('Yes, book it.')); return; }
      const r = await mcpApp.callTool('confirm_plan', { plan_id: plan.id, confirmation_token: current.confirmation_token, user_confirmation: 'tap:approve' });
      if (r.isError) return fail((r.content || []).map((c) => c.text).join(' ').replace(/\s*Next step:.*$/, ''));
      plan.status = 'confirmed';
      const env2 = r.structuredContent && r.structuredContent.receipt && r.structuredContent.receipt.envelope;
      render({ structuredContent: { ...current, plan, envelope: env2 || current.envelope } }, { justBooked: true });
    } catch (e) { fail(tx('Mandat could not be reached. Nothing was booked.')); }
  };
  for (const li of document.querySelectorAll('.rows.tap > li')) {
    const open = () => mcpApp.say(li.dataset.say).catch(() => {});
    li.onclick = open;
    li.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  }
  const x = $('#expand'); if (x) x.onclick = () => mcpApp.requestDisplayMode('fullscreen').catch(() => {});
  const bk = $('#back'); if (bk) bk.onclick = () => mcpApp.requestDisplayMode('inline').catch(() => {});
}
mcpApp.on('result', render);
mcpApp.connect('mandat-plan');
</script></body></html>
