<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mandat item</title>
<style>/*SHARED_CSS*/
/* one item up close: photo gallery on the left, the facts on the right (glanceable: price, when, why, the rule) */
.detail { display: grid; grid-template-columns: minmax(0, 46fr) minmax(0, 54fr); gap: calc(var(--gap) * 1.5); align-items: start; }
.gallery { position: relative; border-radius: var(--radius-in); overflow: hidden; background: var(--fill); aspect-ratio: 1; max-height: calc(var(--avail, 200vh) * .74); }
.track { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; scroll-behavior: smooth; }
.track::-webkit-scrollbar { display: none; }
.track img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; display: block; }
.gallery::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 var(--hair) rgba(0, 0, 0, .1); pointer-events: none; }
.nav { position: absolute; top: 50%; translate: 0 -50%; width: max(48px, 2.2em); height: max(48px, 2.2em); border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; z-index: 1;
  background: rgba(255, 255, 255, .78); color: #000; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  transition: opacity var(--dur-fade) var(--ease-out), transform var(--dur-bouncy) var(--ease-bouncy); }
.nav:active { transform: scale(.92); }
.nav[disabled] { opacity: 0; pointer-events: none; }
.nav svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.nav.prev { left: .45em; } .nav.next { right: .45em; }
.dots { position: absolute; left: 0; right: 0; bottom: .55em; display: flex; justify-content: center; gap: .4em; pointer-events: none; }
.dots i { width: .42em; height: .42em; border-radius: 50%; background: rgba(255, 255, 255, .55); box-shadow: 0 0 0 .5px rgba(0, 0, 0, .2); transition: background-color var(--dur-fade), transform var(--dur-snappy) var(--ease-snappy); }
.dots i.on { background: #fff; transform: scale(1.25); }
.info:not(.status) { display: grid; gap: calc(var(--gap) * .7); min-width: 0; align-content: start; }
.price { display: flex; align-items: baseline; gap: .55em; }
.price s { font-size: var(--t-body); color: var(--label-2); font-weight: 400; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; font-size: var(--t-meta); }
.facts li { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); gap: .8em; padding: .38em 0; border-top: var(--hair) solid var(--sep); }
.facts li:first-child { border-top: 0; padding-top: 0; }
.facts span { color: var(--label-2); }
.facts b { font-weight: 510; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.why { list-style: none; margin: 0; padding: 0; display: grid; gap: .3em; font-size: var(--t-meta); }
.why li { display: flex; gap: .5em; align-items: baseline; }
.why li::before { content: ""; flex: none; width: .5em; height: .5em; border-radius: 50%; background: var(--ok); translate: 0 -.08em; }
/* a price disadvantage is never shown in the positive colour: amber dot; neutral facts: grey dot */
.why li.t-cost::before { background: var(--warn); }
.why li.t-info::before { background: var(--label-3); }
.rule { margin: 0; }
/* compare: two or three columns, rows aligned so the eye reads across */
.cmp { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--gap); }
.col { display: grid; align-content: start; gap: .45em; padding: .6em .7em .8em; border-radius: var(--radius-in); background: var(--surface-2); position: relative; min-width: 0; }
.col.win { box-shadow: inset 0 0 0 max(2px, .16vw) var(--ok); }
.col .ph { aspect-ratio: auto; height: min(5.5em, 17vh); border-radius: calc(var(--radius-in) * .72); overflow: hidden; background: var(--fill); margin: -.1em -.2em .2em; position: relative; }
.col .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.col b.name { font-weight: 590; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col .num { font-size: calc(var(--t-num) * .72); }
.col dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .2em .7em; font-size: var(--t-meta); }
.col dt { color: var(--label-2); } .col dd { margin: 0; font-weight: 510; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col .btn { justify-self: start; margin-top: .3em; }
.verdict { margin: 0; font-size: var(--t-body); font-weight: 590; }
.credit { position: absolute; left: .6em; top: .55em; font-size: calc(var(--t-meta) * .8); color: #fff; background: rgba(0, 0, 0, .55); padding: .15em .5em; border-radius: 999px; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.price .meta { margin-left: .2em; }
@media (max-width: 640px) { .detail { grid-template-columns: minmax(0, 1fr); } .gallery { aspect-ratio: 16 / 10; } .cmp { grid-auto-flow: row; } }
</style></head>
<body><main class="card" id="app" aria-live="polite"><p class="context">Opening the details…</p></main>
<script>/*BRIDGE_JS*/
showLoading('Opening the details…');
const NOUN = { cleaning: 'Cleaning', catering: 'Catering', plumbing: 'Plumbing', handyman: 'Handyman' };
const name = (o) => (o.kind === 'service' ? o.merchant : P(o.title).split(/[:,(]/)[0].trim());
const ARROW = (d) => `<svg viewBox="0 0 24 24"><path d="${d === 'prev' ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}"/></svg>`;
let busy = false;
// Every action is a sentence to Alexa (ui/message), exactly what the user could say: the same guardrails apply.
function act(btn, text) {
  if (busy) return;
  busy = true; btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${esc(btn.textContent)}`;
  mcpApp.say(text).catch(() => { busy = false; btn.disabled = false; btn.removeAttribute('aria-busy'); btn.textContent = btn.dataset.label; });
}
function gallery(images) {
  if (!images.length) return '';
  return `<div class="gallery" role="group" aria-roledescription="carousel" aria-label="${tx('Photos, {n}', { n: images.length })}">
    <div class="track" id="track" tabindex="0">${images.map((im, i) => `<img src="${esc(im.url)}" alt="${esc(im.alt)}" ${i ? 'loading="lazy"' : ''} decoding="async">`).join('')}</div>
    ${images[0].credit ? `<span class="credit">${esc(tx('Photo: {who}', { who: images[0].credit }))}</span>` : ''}
    ${images.length > 1 ? `<button class="nav prev" id="prev" aria-label="${tx('Previous photo')}" disabled>${ARROW('prev')}</button><button class="nav next" id="next" aria-label="${tx('Next photo')}">${ARROW('next')}</button>
    <div class="dots" aria-hidden="true">${images.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
  </div>`;
}
function wireGallery() {
  const t = $('#track'); if (!t) return;
  const n = t.children.length;
  const at = () => Math.round(t.scrollLeft / Math.max(1, t.clientWidth));
  const go = (i) => t.scrollTo({ left: Math.max(0, Math.min(n - 1, i)) * t.clientWidth });
  const sync = () => {
    const i = at();
    document.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i));
    const p = $('#prev'), x = $('#next');
    if (p) p.disabled = i <= 0; if (x) x.disabled = i >= n - 1;
  };
  t.addEventListener('scroll', () => requestAnimationFrame(sync), { passive: true });
  const p = $('#prev'), x = $('#next');
  if (p) p.onclick = () => go(at() - 1);
  if (x) x.onclick = () => go(at() + 1);
  t.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(at() + 1); if (e.key === 'ArrowLeft') go(at() - 1); });
}
function detail(sc) {
  const o = sc.offer;
  const svc = o.kind === 'service';
  const rule = sc.rule;
  const st = sc.in_plan ? status('ok', tx('In your plan')) : rule ? status(rule.buys_on_its_own ? 'ok' : 'wait', tx(rule.buys_on_its_own ? 'Buys on its own' : 'Needs your yes')) : '';
  const h = (o.history || []).filter((x) => x.from === 'merchant' && x.list);
  const nego = h.length && h[h.length - 1].list > h[h.length - 1].total ? `${usd(h[h.length - 1].list)} → ${usd(h[h.length - 1].total)}` : '';
  const real = o.source === 'local' || o.live;
  // the title, the big price and the footer already say what it is, its price and its source: the rows add the rest
  const skip = [tx('What'), 'What', 'Quoi', 'Qué', ...(real ? ['Price', 'Prix', 'Precio', 'Source', 'Fuente', 'Reviews', 'Avis', 'Reseñas'] : [])];
  const specs = (sc.specs || []).filter((x) => !skip.includes(x.k)).slice(0, 4);
  if (nego) specs.splice(1, 0, { k: tx('Negotiated'), v: nego });
  $('#app').innerHTML = `
    <div class="head"><p class="context">${esc(o.source === 'local' ? `${tx(NOUN[o.category] || 'Service')} · ${tx('Real business')} · ${origin(o, { long: true })}` : o.source === 'partner' ? `${tx(NOUN[o.category] || 'Service')} · ${origin(o, { long: true })}` : svc ? `${tx(NOUN[o.category] || 'Service')} · ${tx(o.card_verified ? 'agent verified' : 'agent not verified')}` : `${o.live ? tx('Real product') + ' · ' : o.source === 'test catalogue' ? tx('Test catalogue') + ' · ' : ''}${o.merchant}${o.matches_preference ? tx(' · your usual') : ''}`)}</p>${st}</div>
    <div class="detail">
      ${gallery(sc.images || [])}
      <div class="info">
        <div class="stack"><h1>${esc(svc ? o.merchant : P(o.title))}</h1><span class="meta">${esc(svc ? `${P(o.title)} · ${slotL(o.slot_label)}` : `${o.merchant} · ${slotL(o.slot_label)}`)}${o.rating ? ` · ★ ${esc(o.rating)}${o.ratings ? ` (${Number(o.ratings).toLocaleString(LOC())})` : ''}` : ''}</span></div>
        <div class="price"><span class="num">${esc(priceOf(o))}</span>${o.discount ? `<s>${usd(o.base + (o.fees || 0))}</s>` : o.was ? `<s>${usd(o.was)}</s>` : ''}${o.source === 'local' ? `<span class="meta">${tx('Estimated price')}</span>` : ''}</div>
        <ul class="facts">${specs.map((x) => `<li><span>${esc(x.k)}</span><b>${esc(x.v)}</b></li>`).join('')}</ul>
        ${(sc.why || []).length ? `<ul class="why" aria-label="${tx('Why Mandat picked it')}">${sc.why.slice(0, 3).map((w) => (typeof w === 'string' ? { text: w, tone: 'plus' } : w)).map((w) => `<li class="t-${esc(w.tone)}">${esc(w.text)}</li>`).join('')}</ul>` : ''}
        ${rule ? `<p class="rule">${status(rule.buys_on_its_own ? 'ok' : 'wait', rule.text)}</p>` : ''}
        <div class="actions">
          ${sc.in_plan ? '' : `<button class="btn primary" id="choose" data-label="${tx('Choose')}">${tx('Choose')}</button>`}
          ${sc.alternatives ? `<button class="btn" id="others" data-label="${tx('Other options')}">${tx('Other options')}</button>` : ''}
          ${sc.in_plan ? `<button class="btn" id="remove" data-label="${tx('Remove')}">${tx('Remove')}</button>` : ''}
          ${sc.link && sc.link.url ? `<button class="btn" id="link">${esc(o.live ? tx('View at {m}', { m: sc.link.label }) : tx('Open in {m}', { m: sc.link.label }))}</button>` : ''}
          ${sc.plan_id ? `<button class="btn" id="back" data-label="${tx('Back')}">${tx('Back')}</button>` : ''}
        </div>
      </div>
    </div>${real || o.source === 'partner' ? honestNote(sc.pay_mode, o.live ? 'Channel3' : (o.place && o.place.attribution) || '') : ''}`;
  const lk = $('#link'); if (lk) lk.onclick = () => mcpApp.openLink(sc.link.url).catch(() => {});
  wireGallery();
  const b = (id, text) => { const e = $('#' + id); if (e) e.onclick = () => act(e, text); };
  b('choose', tx(sc.plan_id ? 'Take {name} instead.' : 'Plan {name} for me.', { name: name(o) }));
  b('others', tx('Other options than {name}?', { name: name(o) }));
  b('remove', tx('Remove {name} from the plan.', { name: name(o) }));
  b('back', tx('Show me the plan.'));
}
function compare(sc) {
  const offers = sc.offers || [];
  const cheapest = offers.find((x) => x.id === sc.cheapest_id);
  $('#app').innerHTML = `
    <div class="head"><p class="context">${tx('{n} options side by side', { n: offers.length })}</p>${sc.difference ? status('info', tx('{amt} apart', { amt: usd(sc.difference) })) : ''}</div>
    <div class="cmp">${offers.map((o) => {
      const im = (o.images || [])[0];
      const badge = o.id === sc.cheapest_id ? tx('Cheapest') : o.id === sc.best_rated_id && o.rating ? tx('Best rated') : '';
      return `<section class="col${o.id === sc.cheapest_id ? ' win' : ''}" aria-label="${esc(name(o))}">
        ${im ? `<span class="ph"><img src="${esc(im.url)}" alt="${esc(im.alt)}" decoding="async"></span>` : ''}
        <b class="name">${esc(name(o))}</b>
        <span class="origin${o.source === 'partner' ? ' partner' : ''}">${esc(origin(o))}</span>
        <span class="num">${esc(priceOf(o))}</span>
        <dl>
          <dt>${tx('When')}</dt><dd>${esc(slotL(o.slot_label))}</dd>
          ${o.kind === 'service' ? `<dt>${tx('Rating')}</dt><dd>${o.rating ? esc(o.rating) : '—'}</dd>` : ''}
          <dt>${tx('Saved')}</dt><dd>${o.discount ? usd(o.discount) : '—'}</dd>
        </dl>
        ${badge ? status(o.id === sc.cheapest_id ? 'ok' : 'info', badge) : ''}
        ${o.in_plan ? status('ok', tx('In your plan')) : `<button class="btn${o.id === sc.cheapest_id ? ' primary' : ''}" data-id="${esc(o.id)}" data-label="${tx('Choose')}">${tx('Choose')}</button>`}
      </section>`;
    }).join('')}</div>
    ${cheapest && sc.difference ? `<p class="verdict">${esc(tx('{name} is {amt} cheaper.', { name: name(cheapest), amt: usd(sc.difference) }))}</p>` : ''}`;
  for (const btn of document.querySelectorAll('.col .btn')) {
    const o = offers.find((x) => x.id === btn.dataset.id);
    btn.onclick = () => act(btn, tx(sc.plan_id ? 'Take {name} instead.' : 'Plan {name} for me.', { name: name(o) }));
  }
}
function render(result) {
  if (result.isError) return showError(result);
  const sc = result.structuredContent || {};
  ready(); busy = false;
  if (sc.mode === 'compare') compare(sc); else if (sc.offer) detail(sc);
}
mcpApp.on('result', render);
mcpApp.connect('mandat-item');
</script></body></html>
