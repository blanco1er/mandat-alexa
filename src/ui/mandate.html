<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mandat budget</title>
<style>/*SHARED_CSS*/
/* the three rules, as a band of figures separated by hairlines (no boxed tiles) */
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; }
.rules > div { padding: .1em 1.1em; min-width: 0; display: grid; gap: .2em; }
.rules > div:first-child { padding-left: 0; }
.rules > div + div { border-left: var(--hair) solid var(--sep); }
.rules dt { font-size: var(--t-meta); color: var(--label-2); }
.rules dd { margin: 0; font-weight: 590; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style></head>
<body><main class="card" id="app" aria-live="polite"><p class="context">Setting your budget…</p></main>
<script>/*BRIDGE_JS*/
showLoading('Setting your budget…');
function render(result) {
  if (result.isError) return showError(result);
  const sc = result.structuredContent || {};
  const m = sc.mandate; if (!m) return;
  ready();
  const period = m.period === 'once' ? 'One-time budget' : `${cap(m.period)} budget`;
  const sim = m.paypal && m.paypal.mode === 'offline';
  $('#app').innerHTML = `
    <div class="head"><p class="context">${esc(period)}</p>${m.status === 'active' ? status('ok', 'Active') : status('wait', 'Approve once with PayPal')}</div>
    <div class="hero"><h1>${esc(m.purpose)}</h1><span class="num">${usd(m.budget, m.currency)}</span></div>
    <dl class="rules">
      <div><dt>Buys on its own</dt><dd>${m.auto_approve_under > 0 ? 'Under ' + usd(m.auto_approve_under, m.currency) : 'Never'}</dd></div>
      <div><dt>Above that</dt><dd>Asks for your yes</dd></div>
      <div><dt>Pays with</dt><dd>${sim ? 'Simulated payments' : 'PayPal sandbox'}</dd></div>
    </dl>
    ${sc.envelope ? gauge(sc.envelope) : ''}
    ${sc.approval_url ? '<div class="actions"><button class="btn primary" id="go">Approve with PayPal</button></div>' : ''}`;
  const b = $('#go'); if (b) b.onclick = () => mcpApp.openLink(sc.approval_url).catch(() => {});
}
mcpApp.on('result', render);
mcpApp.connect('mandat-mandate');
</script></body></html>
